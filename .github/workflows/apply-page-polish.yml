name: Apply page polish

on:
  push:
    branches:
      - chore/apply-page-polish
    paths:
      - .github/workflows/apply-page-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/apply-page-polish
      - name: Replace enterprise apply page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('03-enterprise/prototype-v4/index.html')
          text = path.read_text()
          start = text.index('<section class="page" data-page="apply">')
          end = text.index('\n</main>', start)
          new = r'''<section class="page apply-page" data-page="apply">
          <style>
          [data-page="apply"]{--ap-blue:#315ff4;--ap-blue2:#2149d8;--ap-ink:#111827;--ap-muted:#687487;--ap-line:#dfe5ef;--ap-soft:#f5f8ff}
          [data-page="apply"] .apply-stage{position:relative;overflow:hidden;min-height:calc(100vh - 72px);padding:84px 0 96px;background:radial-gradient(circle at 12% 16%,rgba(49,95,244,.13),transparent 30%),radial-gradient(circle at 88% 76%,rgba(95,125,255,.09),transparent 28%),linear-gradient(180deg,#fff 0%,#f7f9fd 100%)}
          [data-page="apply"] .apply-stage:after{content:"";position:absolute;left:-170px;bottom:-280px;width:520px;height:520px;border:1px solid rgba(49,95,244,.08);border-radius:50%;box-shadow:0 0 0 74px rgba(49,95,244,.022),0 0 0 148px rgba(49,95,244,.014);pointer-events:none}
          [data-page="apply"] .apply-shell{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.82fr) minmax(540px,1.18fr);gap:clamp(54px,7vw,100px);align-items:start}
          [data-page="apply"] .apply-intro{position:sticky;top:116px;padding-top:14px}
          [data-page="apply"] .apply-intro h1{max-width:600px;margin:0 0 22px;font-size:58px;line-height:1.05;letter-spacing:-.052em;text-wrap:balance}
          [data-page="apply"] .apply-intro>p{max-width:565px;margin:0;color:var(--ap-muted);font-size:16px;line-height:1.82;text-wrap:pretty}
          [data-page="apply"] .apply-promises{display:grid;gap:0;margin-top:38px;max-width:570px;border-top:1px solid var(--ap-line)}
          [data-page="apply"] .apply-promise{display:grid;grid-template-columns:38px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--ap-line)}
          [data-page="apply"] .apply-promise>span{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#eaf0ff;color:var(--ap-blue);font-size:9px;font-weight:900;letter-spacing:.04em}
          [data-page="apply"] .apply-promise b,[data-page="apply"] .apply-promise small{display:block}
          [data-page="apply"] .apply-promise b{margin:1px 0 5px;color:#202a3d;font-size:13px}
          [data-page="apply"] .apply-promise small{color:#7b8798;font-size:11px;line-height:1.6}
          [data-page="apply"] .apply-links{display:flex;flex-wrap:wrap;gap:18px;margin-top:25px}
          [data-page="apply"] .apply-links a{font-size:12px}
          [data-page="apply"] .apply-form-card{position:relative;padding:34px 36px 32px;border:1px solid rgba(214,222,235,.96);border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 28px 80px rgba(25,42,82,.11);backdrop-filter:blur(16px)}
          [data-page="apply"] .form-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:27px;padding-bottom:22px;border-bottom:1px solid #edf0f5}
          [data-page="apply"] .form-card-head h2{margin:3px 0 7px;font-size:27px;letter-spacing:-.035em}
          [data-page="apply"] .form-card-head p{margin:0;color:#788496;font-size:12px;line-height:1.65}
          [data-page="apply"] .form-time{flex:none;margin-top:3px;padding:7px 10px;border:1px solid #e1e7f0;border-radius:999px;background:#f8faff;color:#74819a;font-size:10px;font-weight:800}
          [data-page="apply"] .apply-form{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
          [data-page="apply"] .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
          [data-page="apply"] .field{position:relative;min-width:0}
          [data-page="apply"] .field.full{grid-column:1/-1}
          [data-page="apply"] .field-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;color:#4f5d73;font-size:11px;font-weight:760}
          [data-page="apply"] .field-label em{color:#a0a9b7;font-style:normal;font-size:9px;font-weight:600}
          [data-page="apply"] .field input,[data-page="apply"] .field textarea{width:100%;border:1px solid #d9e0ea;border-radius:11px;background:#fff;color:#1a2438;outline:none;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
          [data-page="apply"] .field input{height:48px;padding:0 14px}
          [data-page="apply"] .field textarea{min-height:112px;padding:13px 14px;line-height:1.65;resize:vertical}
          [data-page="apply"] .field input::placeholder,[data-page="apply"] .field textarea::placeholder{color:#a5afbd}
          [data-page="apply"] .field input:hover,[data-page="apply"] .field textarea:hover{border-color:#c8d2e1}
          [data-page="apply"] .field input:focus,[data-page="apply"] .field textarea:focus{border-color:#8fa8ff;box-shadow:0 0 0 4px rgba(49,95,244,.09);background:#fff}
          [data-page="apply"] .custom-select{position:relative}
          [data-page="apply"] .select-trigger{width:100%;height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 13px 0 14px;border:1px solid #d9e0ea;border-radius:11px;background:#fff;color:#9aa5b4;text-align:left;cursor:pointer;outline:none;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
          [data-page="apply"] .select-trigger:hover{border-color:#c8d2e1}
          [data-page="apply"] .select-trigger:focus,[data-page="apply"] .custom-select.open .select-trigger{border-color:#8fa8ff;box-shadow:0 0 0 4px rgba(49,95,244,.09)}
          [data-page="apply"] .custom-select.has-value .select-trigger{color:#1a2438}
          [data-page="apply"] .select-trigger svg{width:16px;height:16px;flex:none;stroke:#8190a6;fill:none;stroke-width:1.8;transition:transform .18s ease}
          [data-page="apply"] .custom-select.open .select-trigger svg{transform:rotate(180deg)}
          [data-page="apply"] .select-menu{position:absolute;z-index:30;top:calc(100% + 7px);left:0;right:0;padding:6px;border:1px solid #dce3ed;border-radius:13px;background:#fff;box-shadow:0 18px 44px rgba(24,38,72,.14)}
          [data-page="apply"] .select-menu[hidden]{display:none}
          [data-page="apply"] .select-menu button{width:100%;display:flex;align-items:center;min-height:40px;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#526075;text-align:left;font-size:12px;cursor:pointer}
          [data-page="apply"] .select-menu button:hover,[data-page="apply"] .select-menu button:focus{background:#f1f5ff;color:#1f3eaa;outline:none}
          [data-page="apply"] .custom-select.invalid .select-trigger{border-color:#e39a9a;box-shadow:0 0 0 4px rgba(203,70,70,.07)}
          [data-page="apply"] .solution-group{grid-column:1/-1}
          [data-page="apply"] .solution-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
          [data-page="apply"] .solution-option{position:relative;display:block;cursor:pointer}
          [data-page="apply"] .solution-option input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
          [data-page="apply"] .solution-option>span{display:block;min-height:92px;padding:16px 15px;border:1px solid #dfe5ee;border-radius:13px;background:#fff;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease,transform .18s ease}
          [data-page="apply"] .solution-option:hover>span{transform:translateY(-1px);border-color:#cbd6e8;box-shadow:0 10px 28px rgba(28,44,81,.05)}
          [data-page="apply"] .solution-option input:checked+span{border-color:#8ea6ff;background:linear-gradient(180deg,#f3f6ff,#fff);box-shadow:0 0 0 3px rgba(49,95,244,.075)}
          [data-page="apply"] .solution-option input:focus-visible+span{outline:3px solid rgba(49,95,244,.18);outline-offset:2px}
          [data-page="apply"] .solution-option b,[data-page="apply"] .solution-option small{display:block}
          [data-page="apply"] .solution-option b{color:#26334b;font-size:12px}
          [data-page="apply"] .solution-option small{margin-top:6px;color:#8994a5;font-size:10px;line-height:1.5}
          [data-page="apply"] .solution-option input:checked+span b{color:#254ac8}
          [data-page="apply"] .form-actions{display:flex;align-items:center;gap:16px;margin-top:25px}
          [data-page="apply"] .form-actions .btn{min-width:148px}
          [data-page="apply"] .form-note{margin:0;color:#949dab;font-size:9px;line-height:1.55}
          [data-page="apply"] .success{margin:0;padding:34px 28px;border:1px solid #cfe7da;border-radius:16px;background:linear-gradient(180deg,#f5fbf8,#fff);color:#244a38;text-align:center}
          [data-page="apply"] .success-icon{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 14px;border-radius:50%;background:#e0f4e8;color:#168251;font-size:18px;font-weight:900}
          [data-page="apply"] .success h3{margin:0 0 8px;font-size:20px;color:#183d2d}
          [data-page="apply"] .success p{max-width:430px;margin:0 auto;color:#5f7469;font-size:12px;line-height:1.7}
          [data-page="apply"] .success small{display:block;margin-top:13px;color:#8a9c92;font-size:9px}
          [data-page="apply"] .apply-form.submitted .form-body,[data-page="apply"] .apply-form.submitted .form-actions{display:none}
          @media(max-width:1050px){[data-page="apply"] .apply-shell{grid-template-columns:.85fr 1.15fr;gap:44px}[data-page="apply"] .apply-intro h1{font-size:50px}}
          @media(max-width:900px){[data-page="apply"] .apply-stage{padding:64px 0 78px}[data-page="apply"] .apply-shell{grid-template-columns:1fr;gap:42px}[data-page="apply"] .apply-intro{position:relative;top:auto;padding-top:0}[data-page="apply"] .apply-intro h1{max-width:720px}[data-page="apply"] .apply-intro>p{max-width:680px}[data-page="apply"] .apply-promises{grid-template-columns:repeat(3,1fr);gap:10px;max-width:none;border-top:0}[data-page="apply"] .apply-promise{display:block;padding:17px;border:1px solid var(--ap-line);border-radius:13px;background:rgba(255,255,255,.74)}[data-page="apply"] .apply-promise>span{margin-bottom:14px}[data-page="apply"] .apply-form-card{max-width:760px}}
          @media(max-width:620px){[data-page="apply"] .apply-stage{padding:50px 0 64px}[data-page="apply"] .apply-intro h1{font-size:39px;line-height:1.1}[data-page="apply"] .apply-intro>p{font-size:14px;line-height:1.75}[data-page="apply"] .apply-promises{grid-template-columns:1fr}[data-page="apply"] .apply-form-card{padding:26px 20px 24px;border-radius:18px}[data-page="apply"] .form-card-head{display:block}[data-page="apply"] .form-time{display:inline-flex;margin-top:9px}[data-page="apply"] .form-grid{grid-template-columns:1fr}[data-page="apply"] .field.full,[data-page="apply"] .solution-group{grid-column:1}[data-page="apply"] .solution-options{grid-template-columns:1fr}[data-page="apply"] .solution-option>span{min-height:0}[data-page="apply"] .form-actions{align-items:stretch;flex-direction:column}[data-page="apply"] .form-actions .btn{width:100%}[data-page="apply"] .form-note{text-align:center}}
          </style>
            <section class="apply-stage">
              <div class="container apply-shell">
                <div class="apply-intro reveal">
                  <span class="eyebrow">CONTACT SALES</span>
                  <h1>获取适合你业务的<br>企业发行方案</h1>
                  <p>留下基本业务信息，我们将根据曲库规模、客户协作方式和系统集成需求，协助确认合适的产品版本、发行 API 或组合方案。</p>
                  <div class="apply-promises">
                    <div class="apply-promise"><span>01</span><div><b>方案匹配</b><small>根据业务模式与曲库规模，确认自有品牌发行系统、API 或组合方式。</small></div></div>
                    <div class="apply-promise"><span>02</span><div><b>商务与实施评估</b><small>明确版本、价格、系统边界以及需要的数据迁移或技术集成范围。</small></div></div>
                    <div class="apply-promise"><span>03</span><div><b>上线与持续支持</b><small>从系统配置、数据准备或 API 联调，到正式上线与后续企业服务。</small></div></div>
                  </div>
                  <div class="apply-links"><a class="text-link" href="/enterprise/pricing" data-route>查看版本与价格 →</a><a class="text-link" href="/enterprise/api" data-route>了解发行 API →</a></div>
                </div>

                <div class="apply-form-card reveal">
                  <div class="form-card-head">
                    <div><span class="eyebrow">ENTERPRISE INQUIRY</span><h2>告诉我们你的业务情况</h2><p>仅需填写基础信息，便于我们准确理解你的企业发行需求。</p></div>
                    <span class="form-time">约 1 分钟</span>
                  </div>
                  <form class="apply-form" id="apply-form">
                    <div class="form-body">
                      <div class="form-grid">
                        <label class="field"><span class="field-label">企业名称 <em>必填</em></span><input name="company" required autocomplete="organization" placeholder="企业或品牌名称"></label>
                        <label class="field"><span class="field-label">联系人 <em>必填</em></span><input name="contact" required autocomplete="name" placeholder="姓名"></label>
                        <label class="field"><span class="field-label">工作邮箱 <em>必填</em></span><input name="email" required type="email" autocomplete="email" placeholder="name@company.com"></label>

                        <div class="field">
                          <span class="field-label">企业类型 <em>必填</em></span>
                          <div class="custom-select" data-custom-select data-required>
                            <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="select-value">请选择企业类型</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9.5l5 5 5-5"></path></svg></button>
                            <input type="hidden" name="company_type">
                            <div class="select-menu" role="listbox" hidden>
                              <button type="button" role="option" data-value="distributor">发行商</button>
                              <button type="button" role="option" data-value="label">唱片公司 / 厂牌</button>
                              <button type="button" role="option" data-value="rights">版权公司</button>
                              <button type="button" role="option" data-value="ai-music">AI 音乐 / 创作平台</button>
                              <button type="button" role="option" data-value="music-tech">音乐科技 / SaaS</button>
                              <button type="button" role="option" data-value="content-platform">内容平台</button>
                              <button type="button" role="option" data-value="other">其他</button>
                            </div>
                          </div>
                        </div>

                        <div class="solution-group">
                          <span class="field-label">希望了解的方案 <em>必填</em></span>
                          <div class="solution-options">
                            <label class="solution-option"><input type="radio" name="solution" value="platform" required><span><b>自有品牌发行系统</b><small>搭建企业自己的发行平台与客户门户</small></span></label>
                            <label class="solution-option"><input type="radio" name="solution" value="api" required><span><b>发行 API</b><small>将发行能力接入现有网站、App 或系统</small></span></label>
                            <label class="solution-option"><input type="radio" name="solution" value="unsure" required><span><b>暂不确定</b><small>由我们根据业务现状协助判断产品组合</small></span></label>
                          </div>
                        </div>

                        <div class="field full">
                          <span class="field-label">当前曲库规模 <em>选填</em></span>
                          <div class="custom-select" data-custom-select>
                            <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="select-value">请选择大致规模</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9.5l5 5 5-5"></path></svg></button>
                            <input type="hidden" name="catalog_scale">
                            <div class="select-menu" role="listbox" hidden>
                              <button type="button" role="option" data-value="lt-1000">1,000 首以内</button>
                              <button type="button" role="option" data-value="1k-50k">1,000 - 5 万首</button>
                              <button type="button" role="option" data-value="50k-300k">5 - 30 万首</button>
                              <button type="button" role="option" data-value="gt-300k">30 万首以上</button>
                            </div>
                          </div>
                        </div>

                        <label class="field full"><span class="field-label">业务需求补充 <em>选填</em></span><textarea name="message" rows="4" placeholder="例如：现有发行业务模式、合作客户情况、是否需要历史曲库迁移或 API / SFTP / DDEX 对接等"></textarea></label>
                      </div>
                    </div>
                    <div class="form-actions"><button class="btn btn-primary btn-lg" type="submit">提交企业咨询</button><p class="form-note">Demo 页面暂不提交真实业务数据。</p></div>
                    <div class="success" hidden><span class="success-icon">✓</span><h3>信息已提交</h3><p>我们已收到你的企业咨询。正式流程中，将根据业务信息进一步确认产品版本、API 接入或实施范围。</p><small>当前为产品 Demo，不会实际发送信息。</small></div>
                  </form>
                </div>
              </div>
            </section>
          <script>
          (()=>{const page=document.querySelector('[data-page="apply"]');if(!page)return;const selects=[...page.querySelectorAll('[data-custom-select]')];const closeAll=except=>selects.forEach(root=>{if(root===except)return;root.classList.remove('open');const menu=root.querySelector('.select-menu'),trigger=root.querySelector('.select-trigger');if(menu)menu.hidden=true;if(trigger)trigger.setAttribute('aria-expanded','false')});selects.forEach(root=>{const trigger=root.querySelector('.select-trigger'),menu=root.querySelector('.select-menu'),value=root.querySelector('input[type="hidden"]'),label=root.querySelector('.select-value');trigger?.addEventListener('click',e=>{e.stopPropagation();const willOpen=!root.classList.contains('open');closeAll(root);root.classList.toggle('open',willOpen);menu.hidden=!willOpen;trigger.setAttribute('aria-expanded',String(willOpen));if(willOpen)menu.querySelector('button')?.focus()});menu?.querySelectorAll('button').forEach(option=>option.addEventListener('click',()=>{value.value=option.dataset.value||option.textContent.trim();label.textContent=option.textContent.trim();root.classList.add('has-value');root.classList.remove('invalid','open');menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus()}))});document.addEventListener('click',()=>closeAll());document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});const form=page.querySelector('#apply-form');form?.addEventListener('submit',e=>{const missing=selects.find(root=>root.hasAttribute('data-required')&&!root.querySelector('input[type="hidden"]').value);if(missing){e.preventDefault();e.stopImmediatePropagation();missing.classList.add('invalid');missing.querySelector('.select-trigger')?.focus();return}form.classList.add('submitted')})})();
          </script>
          </section>'''
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Commit patched page and remove temporary workflow
        shell: bash
        run: |
          git config user.name "zeroooolu"
          git config user.email "zeroooolu@gmail.com"
          git rm .github/workflows/apply-page-polish.yml
          git add 03-enterprise/prototype-v4/index.html
          git commit -m "refine(enterprise): redesign enterprise inquiry page"
          git push origin HEAD:chore/apply-page-polish
