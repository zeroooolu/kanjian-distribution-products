历史音乐资产管理 SaaS 报价中的资产管理、资产导入、数字发行、合规检测、版税报表、收入管理、单/多用户分账、建站、客户支持和培训支持继续作为企业版权益设计参考，但只吸收与企业发行产品边界一致的能力，不把歌单、版权法律服务等非核心模块强行塞入当前 Plan。

