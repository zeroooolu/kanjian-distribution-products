### 6.1 Plan 设计原则

企业版 Plan 不通过拆掉核心发行流程制造版本差异。三个版本均应具备完整的曲库、客户门户、发行、状态、数据与收入主链路，差异集中在五个维度：

1. **业务容量**：曲库规模与合作客户规模；
2. **企业运营能力**：独立域名、多客户经营与合作方分账；
3. **批量与系统集成**：Excel、SFTP、XML、DDEX 与发行 API；
4. **实施复杂度**：历史迁移、深度联调与项目制实施；
