name: Update enterprise pricing plans

on:
  push:
    branches:
      - chore/enterprise-plan-pricing

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/enterprise-plan-pricing
          fetch-depth: 0
      - name: Update pricing plan model
        run: python .github/scripts/update_enterprise_pricing.py
      - name: Commit generated pricing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03-enterprise/prototype-v4/index.html 03-enterprise/prototype-v4/styles.css 03-enterprise/README.md
          git diff --cached --quiet && exit 0
          git commit -m "refine(enterprise): formalize plan entitlements [skip ci]"
          git push origin HEAD:chore/enterprise-plan-pricing
