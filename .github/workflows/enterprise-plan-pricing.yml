### 6.5 独立发行 API

**¥9,800 / 年起 + ¥1 / 首 / 渠道**

独立 API 方案面向只需要系统接入能力的企业，不默认包含完整客户发行门户和企业发行平台交付。

### 6.6 可选实施与集成

以下内容根据项目范围单独评估：

- 历史曲库迁移
- 复杂字段映射与数据整理
- API 深度集成
- SFTP / XML / DDEX 对接
- 大型项目实施
- 专属 SLA 与技术服务

企业版商业模型以 **年度平台服务费 + 实际发行使用量 + 必要的项目实施 / 高级服务** 为主，不以普通星球发行的版权分成作为主要收费逻辑。

