name: Fix pricing compare styles

on:
  push:
    branches:
      - fix/pricing-compare-plans
    paths:
      - '.github/scripts/fix_pricing_compare.py'
      - '.github/workflows/fix-pricing-compare.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-compare-plans
          fetch-depth: 0
      - name: Apply pricing compare fix
        run: python .github/scripts/fix_pricing_compare.py
      - name: Commit generated style
        run: |
          if git diff --quiet -- 03-enterprise/prototype-v4/styles.css; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03-enterprise/prototype-v4/styles.css
          git commit -m "fix(enterprise): repair plan comparison layout [skip ci]"
          git push origin HEAD:fix/pricing-compare-plans
