name: Product Copy Concise Helper
on:
  push:
    branches: [chore/product-copy-concise-helper]
    paths:
      - '.github/scripts/refine_product_copy_concise.py'
      - '.github/workflows/product-copy-concise-helper.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/product-copy-concise-helper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/refine_product_copy_concise.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03-enterprise/prototype-v4/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'refine(enterprise): tighten client and catalog copy'
            git push origin HEAD:chore/product-copy-concise-helper
          fi
