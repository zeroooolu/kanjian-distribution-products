name: Product Page Polish Helper
on:
  push:
    branches:
      - chore/product-page-polish-helper
    paths:
      - '.github/scripts/polish_enterprise_product_page.py'
      - '.github/workflows/product-page-polish-helper.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/product-page-polish-helper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/polish_enterprise_product_page.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03-enterprise/prototype-v4/index.html 03-enterprise/prototype-v4/styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'refine(enterprise): polish product page structure'
          git push origin HEAD:chore/product-page-polish-helper
