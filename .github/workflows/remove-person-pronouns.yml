name: Enterprise website system cleanup

on:
  push:
    branches:
      - chore/apply-page-polish

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo
      - name: Checkout cleanup tools
        uses: actions/checkout@v4
        with:
          ref: chore/apply-page-polish
          path: tools
      - name: Apply enterprise website cleanup
        run: python tools/.github/scripts/enterprise_cleanup.py repo
      - name: Commit cleanup to main
        run: |
          cd repo
          git config user.name "zeroooolu"
          git config user.email "zeroooolu@gmail.com"
          git add 03-enterprise/prototype-v4/index.html 03-enterprise/prototype-v4/styles.css 03-enterprise/prototype-v4/styles-base.css 03-enterprise/prototype-v4/README.md
          git diff --cached --quiet && exit 0
          git commit -m "refine(enterprise): unify website content and UX system [skip ci]"
          git push origin HEAD:main
