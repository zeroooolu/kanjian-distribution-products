name: Solutions Page Polish Helper
on:
  push:
    branches:
      - chore/solutions-page-redesign-helper
    paths:
      - '.github/scripts/polish_solutions_page.py'
      - '.github/workflows/solutions-page-polish-helper.yml'
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/polish_solutions_page.py
      - name: Commit generated website files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03-enterprise/prototype-v4/index.html 03-enterprise/prototype-v4/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refine(enterprise): polish solutions page presentation'
          git push
