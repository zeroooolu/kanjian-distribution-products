<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合作方案 · 星球发行</title><link rel="stylesheet" href="app-shell.css"><style>.plan-hero{padding:26px 28px}.plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:30px}.plan-title{display:flex;align-items:center;gap:10px}.plan-title h1{margin:0;font-size:24px;color:#20232a}.badge{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:#e9eeff;color:#2448ff;font-size:11px;font-weight:650}.lead{margin-top:9px;color:#727985;line-height:21px}.hero-actions{display:flex;gap:10px;flex:none}.plain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.plain{padding:15px;border:1px solid #e4e8ef;border-radius:5px;background:#fafbfc}.plain span{display:block;color:#9298a2;font-size:11px}.plain strong{display:block;margin-top:6px;color:#333b47;font-size:15px}.benefits{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px;padding:0 22px 18px}.benefit{display:flex;gap:11px;padding:15px 0;border-top:1px solid #edf0f4}.check{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#edf7f1;color:#1e9a5b;font-size:12px;flex:none}.benefit strong{display:block;color:#343b46}.benefit span{display:block;margin-top:4px;color:#8b919b;font-size:11px;line-height:17px}.usage{padding:0 22px 20px}.usage-row{display:grid;grid-template-columns:180px 1fr 110px;align-items:center;gap:14px;padding:13px 0;border-top:1px solid #edf0f4}.usage-row:first-child{border-top:0}.usage-label{color:#535b67}.bar{height:6px;border-radius:999px;background:#eef0f4;overflow:hidden}.bar i{display:block;height:100%;background:#5b73ff}.usage-num{text-align:right;color:#6f7681;font-size:12px}.service-box{margin:0 22px 22px;padding:15px 16px;border:1px solid #dce3ff;border-radius:5px;background:#f7f9ff}.service-box strong{display:block;color:#30394d}.service-box span{display:block;margin-top:5px;color:#737c90;font-size:12px;line-height:18px}.compare-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 22px 22px}.tier-card{padding:18px;border:1px solid #e2e6ed;border-radius:6px}.tier-card.current{border-color:#aebcff;background:#f8faff}.tier-card h3{margin:0;font-size:16px;color:#2f3641}.for{margin-top:6px;color:#7c838e;font-size:12px;line-height:18px;min-height:38px}.tier-list{margin:15px 0 0;padding:0;list-style:none}.tier-list li{position:relative;padding:6px 0 6px 18px;color:#59616c;font-size:12px}.tier-list li:before{content:'✓';position:absolute;left:0;color:#24a466}.tier-foot{margin-top:14px;padding-top:13px;border-top:1px solid #edf0f4;color:#8a909b;font-size:11px}.internal-note{margin:16px 22px 22px;padding:10px 12px;border-radius:4px;background:#f7f7f8;color:#8b9199;font-size:11px}</style></head><body data-page="plan" data-title="合作方案"><aside class="sidebar"></aside><header class="topbar"></header><main class="workspace"><div class="page"><section class="card plan-hero"><div class="plan-top"><div><div class="plan-title"><h1>我的合作方案</h1><span class="badge" id="badge">Professional 专业版</span></div><div class="lead" id="lead"></div></div><div class="hero-actions"><button class="btn-primary" id="primaryAction">申请扩容</button><button class="btn-default" id="secondAction">申请合作评估</button></div></div><div class="plain-grid"><div class="plain"><span>今年还能新增歌曲</span><strong id="remainTracks"></strong></div><div class="plain"><span>今年还能新增专辑</span><strong id="remainReleases"></strong></div><div class="plain"><span>遇到问题</span><strong id="response"></strong></div></div></section><div class="grid-2" style="margin-top:16px"><section class="card"><div class="section-head"><div><h2>你现在可以用什么</h2><p>只保留真正影响日常发行的差异。</p></div></div><div class="benefits" id="benefits"></div></section><section class="card"><div class="section-head"><div><h2>今年的发行额度</h2><p>接近上限时我们会提前提醒。</p></div></div><div class="usage" id="usage"></div><div class="service-box"><strong id="serviceTitle"></strong><span id="serviceCopy"></span></div></section></div><section class="card" style="margin-top:16px"><div class="section-head"><div><h2>三个合作等级怎么选</h2><p>先看你属于哪一类，再看具体权益。</p></div></div><div class="compare-cards" id="cards"></div><div class="internal-note">合作等级不会自动改变当前合同中的分成比例。Plus 不是公开售卖的会员，而是面向头部和战略合作伙伴的评审制合作。</div></section></div></main><script src="app-shell.js"></script><script>const config={basic:{label:'Basic 基础版',lead:'适合刚开始合作的音乐人和小型厂牌。你仍然拥有完整发行、版税和报表能力，只是发行规模和服务方式更标准。',tracks:'14 首',releases:'13 个',response:'3 个工作日内',benefits:[['完整音乐发行','可以正常创建专辑、发行到标准合作平台。'],['月度版税与报表','照常查看收益、报表和提现。'],['标准发行工具','适合个人音乐人和小规模持续发行。'],['按需扩容','超过免费额度后可单独增加容量。']],usage:[['托管歌曲',438,500],['今年新增歌曲',86,100],['今年新增专辑',37,50]],service:['标准服务','通过服务中心提交问题，一般在 3 个工作日内收到看见侧响应。']},professional:{label:'Professional 专业版',lead:'适合持续发行的厂牌、版权公司和成熟音乐人。相比 Basic，最核心的区别是更大的发行规模、完整批量能力和更快的服务响应。',tracks:'786 首',releases:'588 个',response:'1 个工作日内',benefits:[['更大的发行规模','适合持续更新曲库，不需要频繁购买小额扩容。'],['完整批量能力','批量整理、导入和管理发行内容。'],['优先服务','改单、下架、版权和财务问题进入优先队列。'],['特殊项目可评估','特殊渠道、大目录迁移等可以单独评估。']],usage:[['托管歌曲',12460,50000],['今年新增歌曲',2214,3000],['今年新增专辑',412,1000]],service:['优先服务','通过服务中心提交问题，一般在 1 个工作日内收到看见侧响应。']},plus:{label:'Plus',lead:'适合头部厂牌、大型版权公司和战略合作伙伴。重点不是“更多功能”，而是专属运营、定制规模和复杂项目协同。',tracks:'定制',releases:'定制',response:'重点事项 4 小时内',benefits:[['专属运营对接','复杂问题由固定运营协调，不需要反复解释背景。'],['定制发行规模','按照实际业务规模配置曲库与年度发行容量。'],['专项项目支持','大目录迁移、特殊渠道和复杂履约可专项协同。'],['商务合作空间','独家、预付、长期合作等按项目单独设计。']],usage:[['托管歌曲',186420,300000],['今年新增歌曲',12800,25000],['今年新增专辑',3100,6000]],service:['专属运营','重点事项 4 个工作小时内响应，复杂事项由运营、商务或法务联合协调。']}};const fits={basic:['适合：独立音乐人 / 小型厂牌','完整标准发行','标准客服','500 首托管 / 100 首年度新增'],professional:['适合：持续发行的厂牌 / 版权公司','更高发行容量','完整批量能力','优先服务'],plus:['适合：头部厂牌 / 战略合作伙伴','专属运营','定制容量','特殊项目 / 商务合作']};const names={basic:'Basic 基础版',professional:'Professional 专业版',plus:'Plus'};function render(t){const d=config[t];badge.textContent=d.label;lead.textContent=d.lead;remainTracks.textContent=d.tracks;remainReleases.textContent=d.releases;response.textContent=d.response;benefits.innerHTML=d.benefits.map(x=>`<div class="benefit"><div class="check">✓</div><div><strong>${x[0]}</strong><span>${x[1]}</span></div></div>`).join('');usage.innerHTML=d.usage.map(x=>{const p=Math.round(x[1]/x[2]*100);return `<div class="usage-row"><div class="usage-label">${x[0]}</div><div class="bar"><i style="width:${p}%"></i></div><div class="usage-num">${x[1].toLocaleString()} / ${x[2].toLocaleString()}</div></div>`}).join('');serviceTitle.textContent=d.service[0];serviceCopy.textContent=d.service[1];cards.innerHTML=['basic','professional','plus'].map(k=>`<div class="tier-card${k===t?' current':''}"><h3>${names[k]}${k===t?' · 当前':''}</h3><div class="for">${fits[k][0]}</div><ul class="tier-list">${fits[k].slice(1).map(i=>`<li>${i}</li>`).join('')}</ul><div class="tier-foot">${k==='plus'?'邀请 / 评审制':'由合作情况和年度评估确定'}</div></div>`).join('');secondAction.textContent=t==='plus'?'查看 Plus 合作说明':'申请合作评估';primaryAction.style.display=t==='plus'?'none':'inline-flex'}document.addEventListener('tierchange',e=>render(e.detail.tier));render(localStorage.getItem('star-demo-tier')||'professional')</script></body></html>
